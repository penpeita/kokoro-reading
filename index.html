eason":"変化の前後を比べる手がかりになるから","example":"つぼみが同じ形だった日のメモと、開いた日のメモを比べること","conclusion":"変化した日だけでなく毎日の様子を短く残したい","theme":"essay-memo","reasonIndex":1},{"id":"essay-memo-2","mode":"essay","level":2,"title":"観察のメモ","lines":["花を観察すると、昨日と同じに見える日もある。そんな日にも短い記録を残すとよい。","記録が続いていれば、いつから何が変わったのかを比べやすくなる。","つぼみが同じ形だった日のメモを残しておけば、開いた日のメモと並べて見られる。","大きく変わった日だけでなく、毎日の様子を少しずつ書きたい。"],"topic":"観察したことの記録","claim":"観察では変化がない日も記録するとよい","reason":"変化の前後を比べる手がかりになるから","example":"つぼみが同じ形だった日のメモと、開いた日のメモを比べること","conclusion":"変化した日だけでなく毎日の様子を短く残したい","theme":"essay-memo","reasonIndex":1},{"id":"essay-memo-3","mode":"essay","level":3,"title":"観察のメモ","lines":["観察ノートには、変わったことだけを書けばよいのだろうか。何も変わらないように見えた日にも、書く意味がある。","後で変化に気づいたとき、前の日の状態が分からなければ、違いを確かめにくいからだ。","つぼみが同じ形だった日も記録しておくと、初めて開いた日のメモとの違いがはっきりする。","記録の長さより、比べられるように続けることを大事にしたい。変化のない日も短く残そう。"],"topic":"観察したことの記録","claim":"観察では変化がない日も記録するとよい","reason":"変化の前後を比べる手がかりになるから","example":"つぼみが同じ形だった日のメモと、開いた日のメモを比べること","conclusion":"変化した日だけでなく毎日の様子を短く残したい","theme":"essay-memo","reasonIndex":1},{"id":"essay-memo-4","mode":"essay","level":4,"title":"観察のメモ","lines":["観察ノートを見せ合うと、花が開いた日を大きな絵で残した人がいた。一方、変化が見えなかった日は空白だった。見せ場のある記録だけで、十分なのだろうか。","変化は、別の時点と比べて初めて分かることがある。変わらなかった日の記録があれば、どこまで同じ状態が続いたかも確かめられる。","例えば、つぼみが同じ形だった日のメモと、開いた日のメモを並べれば、開く前と後の違いを話し合える。空白では、その日に見たのかさえ分からない。","毎日長く書く必要はない。「昨日と同じ形」と残すだけでも手がかりになる。目立つ変化がある日だけを選ばず、比べるための短い記録を続けたい。"],"topic":"観察したことの記録","claim":"観察では変化がない日も記録するとよい","reason":"変化の前後を比べる手がかりになるから","example":"つぼみが同じ形だった日のメモと、開いた日のメモを比べること","conclusion":"変化した日だけでなく毎日の様子を短く残したい","theme":"essay-memo","reasonIndex":1},{"id":"essay-sign-1","mode":"essay","level":1,"title":"伝わる案内","lines":["案内には、文字と絵を組み合わせるとよい。","人によって分かりやすい手がかりが違うからだ。","図書室の案内には、部屋の名前と本の絵をつけられる。","使う人を考えて、文字と絵を組み合わせたい。"],"topic":"案内の伝え方","claim":"案内には文字と絵を組み合わせるとよい","reason":"読む人によって分かりやすい手がかりが違うから","example":"図書室の案内に部屋の名前と本の絵をつけること","conclusion":"使う人を考えて文字と絵を組み合わせたい","theme":"essay-sign","reasonIndex":1},{"id":"essay-sign-2","mode":"essay","level":2,"title":"伝わる案内","lines":["学校の案内を作るなら、文字だけでなく絵も使うとよい。","漢字を読める人もいれば、絵の方がすぐに分かる人もいるからだ。","図書室なら、部屋の名前の横に本の絵をつける方法がある。","何を表すか分かる絵を選び、使う人に合わせて文字と組み合わせたい。"],"topic":"案内の伝え方","claim":"案内には文字と絵を組み合わせるとよい","reason":"読む人によって分かりやすい手がかりが違うから","example":"図書室の案内に部屋の名前と本の絵をつけること","conclusion":"使う人を考えて文字と絵を組み合わせたい","theme":"essay-sign","reasonIndex":1},{"id":"essay-sign-3","mode":"essay","level":3,"title":"伝わる案内","lines":["案内の文字を大きくしても、それだけで全員に伝わるとは限らない。文字と絵を合わせる工夫が役立つ。","まだその漢字を習っていない人には、文字の大きさより、別の手がかりが必要になるためだ。","例えば、図書室の名前に本の絵をそえれば、文字を全部読めなくても場所を探す助けになる。","見た目だけで案内を作らず、使う人を思い浮かべ、文字と絵を組み合わせることが大切だ。"],"topic":"案内の伝え方","claim":"案内には文字と絵を組み合わせるとよい","reason":"読む人によって分かりやすい手がかりが違うから","example":"図書室の案内に部屋の名前と本の絵をつけること","conclusion":"使う人を考えて文字と絵を組み合わせたい","theme":"essay-sign","reasonIndex":1},{"id":"essay-sign-4","mode":"essay","level":4,"title":"伝わる案内","lines":["案内は短いほど見やすいという意見がある。確かに長い説明は読みにくいが、文字を減らすだけで伝わる案内になるとは限らない。","使う人の年齢や、知っている言葉は同じではない。文字と絵のように異なる手がかりを用意すれば、一つだけでは分からない人を助けられる。","図書室の案内に部屋の名前と本の絵をつけると、名前を読める人にも、まだ漢字を習っていない人にも手がかりを示せる。","ただし、絵なら何でもよいわけではない。意味が伝わるか使う人に確かめながら、文字と絵を組み合わせたい。短さだけでなく、届くかどうかを基準にしたいのである。"],"topic":"案内の伝え方","claim":"案内には文字と絵を組み合わせるとよい","reason":"読む人によって分かりやすい手がかりが違うから","example":"図書室の案内に部屋の名前と本の絵をつけること","conclusion":"使う人を考えて文字と絵を組み合わせたい","theme":"essay-sign","reasonIndex":1},{"id":"essay-water-1","mode":"essay","level":1,"title":"水やりの前に","lines":["水やりの前には、土の様子を確かめるとよい。","必要な水の量は、土のかわき方で違うからだ。","雨のあとの土はしめり、晴れた日の土はかわいていることがある。","決まった量だけに頼らず、土を見て水やりをしたい。"],"topic":"植物への水やり","claim":"水やりの前に土の様子を確かめるとよい","reason":"必要な水の量は土のかわき方によって違うから","example":"雨のあとのしめった土と晴れた日のかわいた土を比べること","conclusion":"決まった量だけに頼らず土を見て水やりをしたい","theme":"essay-water","reasonIndex":1},{"id":"essay-water-2","mode":"essay","level":2,"title":"水やりの前に","lines":["植物に毎日同じ量の水をやればよい、と決めてしまわない方がよい。まず土を確かめたい。","必要な水の量は、土がどれくらいかわいているかでも変わるからだ。","同じ植木ばちでも、雨のあとは土がしめり、晴れた日にはかわいていることがある。","いつもの量に頼るだけでなく、その日の土を見て水やりを考えたい。"],"topic":"植物への水やり","claim":"水やりの前に土の様子を確かめるとよい","reason":"必要な水の量は土のかわき方によって違うから","example":"雨のあとのしめった土と晴れた日のかわいた土を比べること","conclusion":"決まった量だけに頼らず土を見て水やりをしたい","theme":"essay-water","reasonIndex":1},{"id":"essay-water-3","mode":"essay","level":3,"title":"水やりの前に","lines":["水やり係の仕事は、じょうろを空にすることだろうか。大事なのは、水をやる前に土の様子を見ることだ。","同じ場所の植物でも、雨や日ざしによって土のかわき方が違い、必要な水も変わる。","雨のあとのしめった土と、晴れが続いた日のかわいた土を比べると、毎回同じではないことが分かる。","水の量を最初から決めるより、その日の土を確かめてから水やりをする習慣をつけたい。"],"topic":"植物への水やり","claim":"水やりの前に土の様子を確かめるとよい","reason":"必要な水の量は土のかわき方によって違うから","example":"雨のあとのしめった土と晴れた日のかわいた土を比べること","conclusion":"決まった量だけに頼らず土を見て水やりをしたい","theme":"essay-water","reasonIndex":1},{"id":"essay-water-4","mode":"essay","level":4,"title":"水やりの前に","lines":["当番の仕事は手順が決まっていると続けやすい。ただ、水やりを「一つのはちに一杯」と決めるだけでは、植物の様子を見なくなるおそれがある。","土のかわき方は天気や置く場所によって異なる。そのため、決めた量を守ることと、その日に必要な水をやることは、必ずしも同じではない。","例えば、雨のあとは同じはちの土がしめっていても、晴れが続くとかわくことがある。前の日にしたことを、そのままくり返せばよいとは言えない。","手順をなくすのではなく、その初めに「土を確かめる」を入れたい。植物の種類にも目を向けながら、決まった量だけに頼らない水やりを考えることが大切だ。"],"topic":"植物への水やり","claim":"水やりの前に土の様子を確かめるとよい","reason":"必要な水の量は土のかわき方によって違うから","example":"雨のあとのしめった土と晴れた日のかわいた土を比べること","conclusion":"決まった量だけに頼らず土を見て水やりをしたい","theme":"essay-water","reasonIndex":1},{"id":"essay-talk-1","mode":"essay","level":1,"title":"話し合いの理由","lines":["話し合いでは、意見と一緒に理由も伝えるとよい。","考えの違いや共通点を確かめやすくなるからだ。","遊びを選ぶとき、「道具が少なくてすむから」と理由を言える。","意見と理由を組にして話し合いたい。"],"topic":"話し合いでの理由","claim":"意見を言うときは理由も伝えるとよい","reason":"考えの違いや共通点を確かめやすくなるから","example":"遊びを選ぶときに「道具が少なくてすむ」と理由を伝えること","conclusion":"意見と理由を組にして話し合いたい","theme":"essay-talk","reasonIndex":1},{"id":"essay-talk-2","mode":"essay","level":2,"title":"話し合いの理由","lines":["自分の意見を言うときは、そう思った理由も伝えたい。","理由が分かると、違う意見の人とも、同じように考えている部分を探せる。","遊びを選ぶとき、「道具が少なくてすむから」と言えば、準備を大切にしていると伝わる。","賛成か反対かだけで終わらず、意見と理由を組にして話し合うとよい。"],"topic":"話し合いでの理由","claim":"意見を言うときは理由も伝えるとよい","reason":"考えの違いや共通点を確かめやすくなるから","example":"遊びを選ぶときに「道具が少なくてすむ」と理由を伝えること","conclusion":"意見と理由を組にして話し合いたい","theme":"essay-talk","reasonIndex":1},{"id":"essay-talk-3","mode":"essay","level":3,"title":"話し合いの理由","lines":["話し合いで意見が分かれると、すぐに多数決をしたくなる。しかし、その前に理由を伝え合う時間がほしい。","別々の案でも、理由を聞けば共通して大切にしていることが見つかる場合があるからだ。","遊びの案が違っても、どちらも「道具が少なくてすむから」と考えているかもしれない。","意見の数だけを数える前に、意見と理由を組にして伝え合うことを大事にしたい。"],"topic":"話し合いでの理由","claim":"意見を言うときは理由も伝えるとよい","reason":"考えの違いや共通点を確かめやすくなるから","example":"遊びを選ぶときに「道具が少なくてすむ」と理由を伝えること","conclusion":"意見と理由を組にして話し合いたい","theme":"essay-talk","reasonIndex":1},{"id":"essay-talk-4","mode":"essay","level":4,"title":"話し合いの理由","lines":["限られた時間で決めるには、多数決は便利な方法である。だが、意見が出た直後に数を数えると、なぜその案を選んだのかが置き去りになる。","理由を共有すれば、違う案の間にも共通点を探せる。共通点が分かれば、それを満たす別の案を考える道も開ける。","例えば遊びを決めるとき、別々の遊びを選んだ二人が、どちらも「道具が少なくてすむ」ことを理由にしていたら、準備の少ない第三の遊びも候補になる。","多数決そのものをやめる必要はない。決める前に意見と理由を組にして伝えることが、互いの考えを生かす話し合いにつながるのである。"],"topic":"話し合いでの理由","claim":"意見を言うときは理由も伝えるとよい","reason":"考えの違いや共通点を確かめやすくなるから","example":"遊びを選ぶときに「道具が少なくてすむ」と理由を伝えること","conclusion":"意見と理由を組にして話し合いたい","theme":"essay-talk","reasonIndex":1},{"id":"essay-map-1","mode":"essay","level":1,"title":"通学路の地図","lines":["地図には、歩く人が注意する場所も記すとよい。","道の形だけでは分からないことを伝えられるからだ。","曲がり角に「かべで先が見えにくい」と書きそえられる。","道の形と歩いて気づいたことを合わせて、地図を作りたい。"],"topic":"通学路の地図作り","claim":"地図には歩く人が注意する場所も記すとよい","reason":"道の形だけでは分からないことを伝えられるから","example":"曲がり角に「かべで先が見えにくい」と書きそえること","conclusion":"道の形と歩いて気づいたことを合わせて地図を作りたい","theme":"essay-map","reasonIndex":1},{"id":"essay-map-2","mode":"essay","level":2,"title":"通学路の地図","lines":["通学路の地図を作るなら、道の形だけでなく注意する場所も記したい。","実際に歩くと、地図の線だけでは気づけないことがあるからだ。","曲がり角に高いかべがあれば、「先が見えにくい」と書きそえられる。","形を正しく写すことに加え、歩いて気づいたことが伝わる地図を作りたい。"],"topic":"通学路の地図作り","claim":"地図には歩く人が注意する場所も記すとよい","reason":"道の形だけでは分からないことを伝えられるから","example":"曲がり角に「かべで先が見えにくい」と書きそえること","conclusion":"道の形と歩いて気づいたことを合わせて地図を作りたい","theme":"essay-map","reasonIndex":1},{"id":"essay-map-3","mode":"essay","level":3,"title":"通学路の地図","lines":["地図に道を正しく描けたら、それで完成だろうか。通学に使う地図には、歩く人のための情報も必要だ。","同じ形の曲がり角でも、周りの建物によって見える範囲が違うことがある。線だけではその違いが分からない。","高いかべのある曲がり角に「先が見えにくい」と書けば、歩くときに確かめる場所が伝わる。","道の形に、歩いて見つけた注意点を重ねることで、使う人に役立つ地図にしたい。"],"topic":"通学路の地図作り","claim":"地図には歩く人が注意する場所も記すとよい","reason":"道の形だけでは分からないことを伝えられるから","example":"曲がり角に「かべで先が見えにくい」と書きそえること","conclusion":"道の形と歩いて気づいたことを合わせて地図を作りたい","theme":"essay-map","reasonIndex":1},{"id":"essay-map-4","mode":"essay","level":4,"title":"通学路の地図","lines":["地図は実際の場所のすべてを写すものではなく、目的に合う情報を選んで示すものだ。通学路なら、道順に加えて歩くときの注意点を選びたい。","道の線が同じでも、建物や見通しは異なる。通る人が必要とする情報は、線の正確さだけでは表せないのである。","例えば、高いかべのある曲がり角に「先が見えにくい」と書きそえると、そこで周囲を確かめる必要があると伝えられる。","ただし、情報を詰めこみすぎれば読みにくくなる。道の形と、実際に歩いて確かめた注意点を選んで合わせることが、目的に合った地図作りにつながる。"],"topic":"通学路の地図作り","claim":"地図には歩く人が注意する場所も記すとよい","reason":"道の形だけでは分からないことを伝えられるから","example":"曲がり角に「かべで先が見えにくい」と書きそえること","conclusion":"道の形と歩いて気づいたことを合わせて地図を作りたい","theme":"essay-map","reasonIndex":1},{"id":"essay-borrow-1","mode":"essay","level":1,"title":"道具の置き場所","lines":["みんなの道具は、決めた場所に戻すとよい。","次に使う人が探す時間を減らせるからだ。","はさみの形を描いた場所に戻せば、置き場所が分かる。","次に使う人を考えて、元の場所に戻したい。"],"topic":"共用の道具の片づけ","claim":"みんなの道具は決めた場所に戻すとよい","reason":"次に使う人が探す時間を減らせるから","example":"はさみの形を描いた場所にはさみを戻すこと","conclusion":"次に使う人を考えて道具を元の場所に戻したい","theme":"essay-borrow","reasonIndex":1},{"id":"essay-borrow-2","mode":"essay","level":2,"title":"道具の置き場所","lines":["共用の道具を片づけるときは、決めた場所に戻すことが大切だ。","どこにあるか分かれば、次の人が探し回らずに使い始められる。","はさみの形を描いた場所に戻す方法なら、戻す場所も見つけやすい。","自分が使い終わったときに、次の人のことまで考えて片づけたい。"],"topic":"共用の道具の片づけ","claim":"みんなの道具は決めた場所に戻すとよい","reason":"次に使う人が探す時間を減らせるから","example":"はさみの形を描いた場所にはさみを戻すこと","conclusion":"次に使う人を考えて道具を元の場所に戻したい","theme":"essay-borrow","reasonIndex":1},{"id":"essay-borrow-3","mode":"essay","level":3,"title":"道具の置き場所","lines":["道具を棚に入れさえすれば、片づけたと言えるだろうか。みんなで使う物には、決まった置き場所が必要である。","空いた場所に入れるだけでは、次の人は道具があるかどうかから調べなければならない。","例えば、はさみの形を描いたところに戻せば、次の人はそこを見て使えるか確かめられる。","見た目を整えるだけでなく、次に使う人が探す時間を減らすために、道具を元の場所に戻したい。"],"topic":"共用の道具の片づけ","claim":"みんなの道具は決めた場所に戻すとよい","reason":"次に使う人が探す時間を減らせるから","example":"はさみの形を描いた場所にはさみを戻すこと","conclusion":"次に使う人を考えて道具を元の場所に戻したい","theme":"essay-borrow","reasonIndex":1},{"id":"essay-borrow-4","mode":"essay","level":4,"title":"道具の置き場所","lines":["片づけというと、自分の机から物をなくすことだと考えがちだ。しかし共用の道具では、自分の周りが空いただけでは仕事が終わったとは言えない。","次に使う人にとっては、必要な物がどこにあるか分かることが大切だ。毎回違う棚へしまえば、片づけた人の代わりに次の人が探すことになる。","はさみの形を描いた場所へはさみを戻す工夫は、その一例だ。形が見えたままなら使われていると分かり、置かれていればすぐ手に取れる。","場所の決め方は使いながら見直してよい。ただ、使い終わるたびに勝手に変えるのではなく、次の人の探す時間を減らせる共通の場所へ戻すことを大切にしたい。"],"topic":"共用の道具の片づけ","claim":"みんなの道具は決めた場所に戻すとよい","reason":"次に使う人が探す時間を減らせるから","example":"はさみの形を描いた場所にはさみを戻すこと","conclusion":"次に使う人を考えて道具を元の場所に戻したい","theme":"essay-borrow","reasonIndex":1},{"id":"essay-read-1","mode":"essay","level":1,"title":"本を選ぶ入口","lines":["本は、表紙だけでなく中身も見て選ぶとよい。","表紙だけでは、文章や内容の様子が分からないからだ。","最初の一ページを読めば、言葉の難しさを確かめられる。","表紙をきっかけにしながら、中身も確かめて選びたい。"],"topic":"読む本の選び方","claim":"本は表紙だけでなく中身も見て選ぶとよい","reason":"表紙だけでは文章や内容の様子が分からないから","example":"最初の一ページを読んで言葉の難しさを確かめること","conclusion":"表紙をきっかけにしながら中身も確かめて選びたい","theme":"essay-read","reasonIndex":1},{"id":"essay-read-2","mode":"essay","level":2,"title":"本を選ぶ入口","lines":["気に入った表紙の本を手に取ったら、中も少し読んでみるとよい。","表紙の絵だけでは、自分が読みたい内容か、読めそうな文章か分からないからだ。","最初の一ページを読むと、言葉の難しさや文章の長さを確かめられる。","表紙との出会いを大事にしつつ、中身も見て本を選びたい。"],"topic":"読む本の選び方","claim":"本は表紙だけでなく中身も見て選ぶとよい","reason":"表紙だけでは文章や内容の様子が分からないから","example":"最初の一ページを読んで言葉の難しさを確かめること","conclusion":"表紙をきっかけにしながら中身も確かめて選びたい","theme":"essay-read","reasonIndex":1},{"id":"essay-read-3","mode":"essay","level":3,"title":"本を選ぶ入口","lines":["目を引く表紙は、本を選ぶきっかけになる。ただし、そのきっかけだけで決めてしまうのはもったいない。","表紙から受ける感じと、実際の文章や内容が違うこともあるためだ。","最初の一ページを読んでみれば、使われている言葉が自分にどれくらい読めそうか確かめられる。","表紙を否定するのではなく、そこから一歩進んで、中身も見ながら読む本を選びたい。"],"topic":"読む本の選び方","claim":"本は表紙だけでなく中身も見て選ぶとよい","reason":"表紙だけでは文章や内容の様子が分からないから","example":"最初の一ページを読んで言葉の難しさを確かめること","conclusion":"表紙をきっかけにしながら中身も確かめて選びたい","theme":"essay-read","reasonIndex":1},{"id":"essay-read-4","mode":"essay","level":4,"title":"本を選ぶ入口","lines":["表紙で本を選ぶのはよくない、と言う人がいる。私はそう言い切る必要はないと思う。表紙は、知らなかった本に出会う入口にもなるからだ。","ただし、表紙だけでは文章の難しさや話の進み方まで分からない。読む前の期待と中身の間に、違いがあるかもしれない。","例えば、最初の一ページを開いて読むと、見た目は難しそうでも言葉は読みやすいと気づくことがある。反対のこともあり得る。","表紙を選ぶ基準から外すのでも、表紙だけで決めるのでもない。気になった本の中身を少し確かめることで、自分なりの本の選び方を広げたい。"],"topic":"読む本の選び方","claim":"本は表紙だけでなく中身も見て選ぶとよい","reason":"表紙だけでは文章や内容の様子が分からないから","example":"最初の一ページを読んで言葉の難しさを確かめること","conclusion":"表紙をきっかけにしながら中身も確かめて選びたい","theme":"essay-read","reasonIndex":1},{"id":"essay-practice-1","mode":"essay","level":1,"title":"練習をふり返る","lines":["練習のあとには、できた点と次に直す点を記すとよい。","次に何を練習するか決めやすくなるからだ。","なわとびなら、続いた回数と引っかかる場面を書ける。","できた点と課題の両方を残し、次の練習につなげたい。"],"topic":"練習のふり返り方","claim":"練習のあとにできた点と次に直す点を記すとよい","reason":"次に何を練習するか決めやすくなるから","example":"なわとびで続いた回数と引っかかる場面を書くこと","conclusion":"できた点と課題の両方を残して次の練習につなげたい","theme":"essay-practice","reasonIndex":1},{"id":"essay-practice-2","mode":"essay","level":2,"title":"練習をふり返る","lines":["練習が終わったら、できたことと、次に直したいことを一つずつ書くとよい。","よかった点を残しながら、次に取り組むことを決められるからだ。","なわとびなら、続いた回数だけでなく、どんなときに引っかかったかも書ける。","成功だけ、失敗だけにせず、両方を残して次の練習につなげたい。"],"topic":"練習のふり返り方","claim":"練習のあとにできた点と次に直す点を記すとよい","reason":"次に何を練習するか決めやすくなるから","example":"なわとびで続いた回数と引っかかる場面を書くこと","conclusion":"できた点と課題の両方を残して次の練習につなげたい","theme":"essay-practice","reasonIndex":1},{"id":"essay-practice-3","mode":"essay","level":3,"title":"練習をふり返る","lines":["練習の記録が「うまくいかなかった」だけでは、次も同じところから始めることになる。できた点と直す点を分けて残したい。","分けて考えると、続けてよい方法と変えてみる方法が見え、次の練習を決めやすくなる。","なわとびなら、続いた回数に加え、着地のあとで引っかかったことも書くと、次に確かめる動きが分かる。","結果を一言で片づけず、できた点と課題を両方残し、次にすることへ結びつけたい。"],"topic":"練習のふり返り方","claim":"練習のあとにできた点と次に直す点を記すとよい","reason":"次に何を練習するか決めやすくなるから","example":"なわとびで続いた回数と引っかかる場面を書くこと","conclusion":"できた点と課題の両方を残して次の練習につなげたい","theme":"essay-practice","reasonIndex":1},{"id":"essay-practice-4","mode":"essay","level":4,"title":"練習をふり返る","lines":["練習を評価するとき、成功したか失敗したかの二つだけで考えることがある。しかし、その分け方だけでは、同じ結果の中にある違いを見落とす。","できた点と直す点を残せば、保ちたい方法と変えたい方法を区別できる。その区別が、次の練習の内容を決める手がかりになる。","例えばなわとびでは、続いた回数が前回と同じでも、引っかかる場面が違うかもしれない。回数と場面の両方を書けば、次に確かめることが具体的になる。","記録のためだけに長く書く必要はない。できた点と課題を短く一つずつ残し、次の行動に結びつけることを、ふり返りの目的にしたい。"],"topic":"練習のふり返り方","claim":"練習のあとにできた点と次に直す点を記すとよい","reason":"次に何を練習するか決めやすくなるから","example":"なわとびで続いた回数と引っかかる場面を書くこと","conclusion":"できた点と課題の両方を残して次の練習につなげたい","theme":"essay-practice","reasonIndex":1},{"id":"essay-question-1","mode":"essay","level":1,"titl <script id="classic-bank" type="application/json">[{"id":"classic-gon","theme":"classic-gon","mode":"story","level":4,"title":"ごん狐 — 届かなかった親切","person":"ごん","context":"前の場面の要約（本アプリ作成）：ごんは、兵十の取ったうなぎを逃がしました。兵十の母が亡くなったと知り、つぐないのつもりで別の人から盗んだいわしを兵十の家へ届けました。しかし兵十は、いわしを盗んだと疑われ、傷を負いました。以下は原文の抜粋です。","lines":["ごんは、これはしまったと思いました。かわいそうに兵十は、いわし屋にぶんなぐられて、あんな傷までつけられたのか。","ごんはこうおもいながら、そっと物置の方へまわってその入口に、栗をおいてかえりました。","つぎの日も、そのつぎの日もごんは、栗をひろっては、兵十の家へもって来てやりました。","そのつぎの日には、栗ばかりでなく、まつたけも二、三ぼんもっていきました。"],"event":"ごんが、兵十に傷を負わせる結果になったと気づいた","action":"そっと物置の入口に栗を置いて帰った","feel":["悲しい","不安"],"why":"①の「これはしまった」と、②の「そっと」「栗をおいてかえりました」を結ぶと、かえって傷つけた後悔や、今度こそつぐないたい気持ちが考えられます。「悲しい」だけでなく、誰に何をしたことへの思いかを説明できます。","change":"①では自分の行動の結果に後悔しています。③④では何日も食べ物を届け続けているので、後悔を残しつつ、つぐないたい思いを行動にしていると読めます。兵十に気持ちが伝わったとは、この部分だけでは言えません。","source":{"author":"新美南吉","title":"ごん狐","url":"https://www.aozora.gr.jp/cards/000121/files/628_14895.html","note":"第三節より抜粋。ルビを省き、学習用に四つのまとまりへ区切った。栗＝くり。つぐない＝自分のしたことを埋め合わせようとすること。"}},{"id":"classic-gloves","theme":"classic-gloves","mode":"story","level":4,"title":"手袋を買いに — 人間への見方","person":"子狐","context":"前の場面の要約（本アプリ作成）：母さん狐は人間が怖いと子狐に話し、人間の手に変えた方を店で出すように言いました。子狐は間違えて狐の手を出しましたが、帽子屋はお金を受け取り、手袋を渡してくれました。母と帰る場面の原文です。","lines":["二匹の狐は森の方へ帰って行きました。月が出たので、狐の毛なみが銀色に光り、その足あとには、コバルトの影がたまりました。","「母ちゃん、人間ってちっとも恐かないや」","「どうして？」\n「坊、間違えてほんとうのお手々出しちゃったの。でも帽子屋さん、掴まえやしなかったもの。ちゃんとこんないい暖い手袋くれたもの」\nと言って手袋のはまった両手をパンパンやって見せました。","お母さん狐は、\n「まあ！」とあきれましたが、「ほんとうに人間はいいものかしら。ほんとうに人間はいいものかしら」とつぶやきました。"],"event":"子狐が手袋を買い、母と森へ帰っていた","action":"人間は少しも怖くないと母に言った","feel":["安心","うれしい","驚き"],"why":"②の「ちっとも恐かないや」を、③の「掴まえやしなかった」「暖い手袋くれた」とつなげると、自分の経験から安心した気持ちが考えられます。手を見せる行動には、うれしさや母に知らせたい気持ちも読み取れます。","change":"子狐は、母から聞いた「怖い人間」という見方から、自分は親切にしてもらったという見方をしています。母の④は子狐の言葉ではありません。母に疑いが残ることと、子狐の安心を分けて考えます。","source":{"author":"新美南吉","title":"手袋を買いに","url":"https://www.aozora.gr.jp/cards/000121/files/637_13341.html","note":"末尾より抜粋。ルビを省き、改行とまとまりを整理した。子狐＝こぎつね。恐かない＝こわかない。掴まえ＝つかまえ。暖い＝あたたかい。"}},{"id":"classic-tree","theme":"classic-tree","mode":"story","level":4,"title":"去年の木 — 約束の歌","person":"小鳥","context":"前の場面の要約（本アプリ作成）：小鳥は、仲よしの木に来年も歌を聞かせると約束しました。春に戻ると木は切られていました。探し続けると、その木はマッチになって使われたと分かりました。以下は原文の抜粋です。","lines":["すると女の子は、\n「マッチはもえてしまいました。けれどマッチのともした火が、まだこのランプにともっています。」\nといいました。","小鳥は、ランプの火をじっとみつめておりました。","それから、去年の歌をうたって火にきかせてやりました。火はゆらゆらとゆらめいて、こころからよろこんでいるようにみえました。","歌をうたってしまうと、小鳥はまたじっとランプの火をみていました。それから、どこかへとんでいってしまいました。"],"event":"木からできたマッチの火がランプに残っていると聞いた","action":"ランプの火をじっと見つめた","feel":["悲しい","驚き","安心"],"why":"木を探してきた事情と②の「じっとみつめて」を合わせると、木に会えない悲しさや、木につながる火を見つけた思いが考えられます。安心と読む場合も、「木が元に戻った」ではなく、歌を届ける先を見つけたことなどにつなげます。","change":"②で火を見つめ、③で約束していた歌を歌い、④でも再び見つめています。悲しみが消えて喜びだけになったとは限りません。木を思う気持ちを持ったまま、約束を果たして別れた、と考えられます。","source":{"author":"新美南吉","title":"去年の木","url":"https://www.aozora.gr.jp/cards/000121/files/4719_13221.html","note":"末尾より抜粋。ルビを省き、改行とまとまりを整理した。ランプ＝火をともして明かりにする道具。"}}]</script>
<script>
'use strict';
const BANK=JSON.parse(document.getElementById('question-bank').textContent);
const CLASSICS=JSON.parse(document.getElementById('classic-bank').textContent);
const FEELINGS=['うれしい','悲しい','怒り','不安','恥ずかしい','悔しい','安心','驚き'];
const LEVELS=['短い文から','自分の言葉で','行動から考える','前後をつなぐ'];
const app=document.getElementById('app');
const state={mode:'story',level:1,count:5,screen:'home',queue:[],index:0,step:0,answers:[],checked:false,reflection:null,selected:[],draft:'',failures:0,records:[],reviewOnly:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>s.normalize('NFKC').replace(/[\s「」『』。、，．！？!?]/g,'');
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickQuestions(mode,level,count){const pool=BANK.filter(q=>q.mode===mode&&q.level===level);if(!['story','essay'].includes(mode)||![1,2,3,4].includes(level)||!Number.isInteger(count)||count<1||count>10||pool.length<count)throw Error('練習の設定を確かめてください');return shuffled(pool).slice(0,count)}
function labels(q){return q.mode==='story'?['出来事','言葉・行動','気持ち','根拠','気持ちの変化']:['話題','筆者の考え','根拠・理由','具体例','結論']}
function expected(q,step){if(q.mode==='story')return [q.event,q.action,q.feel.join('・'),q.lines[1],q.change][step];return [q.topic,q.claim,q.lines[q.reasonIndex??1],q.example,q.conclusion][step]}
function questionInfo(q,step){
 if(q.mode==='story')return [
 {prompt:'何が起きましたか？',help:'最初の場面に書かれている出来事を選ぼう。',type:'choice'},
 {prompt:`そのとき、${q.person}は何をしましたか？`,help:'②の言葉や行動に注目しよう。想像した気持ちと分けて考えるよ。',type:'choice'},
 {prompt:`②のとき、${q.person}はどんな気持ちでしょう？`,help:q.level===1?'当てはまると思うものを選ぼう。二つ以上でもいいよ。':q.level===2?'何に対して、どんな気持ちなのか、自分の言葉で書こう。':q.level===3?'気持ちを表す言葉がなくても、行動・表情・せりふから考えよう。':'前の事情も合わせて、表に出した言葉と内側の思いを考えよう。',type:q.level===1?'feeling':'text'},
 {prompt:'そう考えた手がかりは、どの言葉？',help:'文章の行を押すと、下の欄をその行に置き換えるよ。選んだあと、必要な部分だけに短くしてもいいよ。',type:'evidence'},
 {prompt:'初めと終わりで、気持ちはどう変わった？',help:q.level===1?'初めと終わりの気持ちを選んでみよう。同じ気持ちが残っていてもいいよ。':q.level===4?'初めと終わり、両方の言葉を手がかりに、きっかけも入れて説明しよう。残った気持ちもあっていいよ。':'初めの気持ち → きっかけ → 終わりの気持ち。消えずに残った気持ちがあってもいいよ。',type:q.level===1?'change':'text'}
 ][step];
 return [
 {prompt:'この文章は、何について書かれていますか？',help:'全体に共通する話題を選ぼう。',type:'choice'},
 {prompt:'筆者が伝えたい考えは何ですか？',help:'筆者とは、この文章を書いた人のこと。気持ちではなく、考えを読み取ろう。',type:q.level===1?'choice':'text'},
 {prompt:'なぜそう考えていますか？',help:q.level>=3?'考えを支える理由の言葉を抜き出そう。例そのものと理由を分けて考えるよ。':'自分の意見ではなく、文章にある理由の言葉を抜き出そう。行を押して選べるよ。',type:'evidence'},
 {prompt:'考えを説明するために、どんな例を出していますか？',help:'文章にある具体的な場面や工夫を、自分の言葉で短くまとめよう。',type:q.level===1?'choice':'text'},
 {prompt:'最後に、どんなことを伝えていますか？',help:'例だけで終わらず、文章全体をふまえた結論をまとめよう。',type:q.level===1?'choice':'text'}
 ][step]
}
function distractors(q,step){const key=q.mode==='story'?(step===0?'event':'action'):[ 'topic','claim','reason','example','conclusion'][step];const others=BANK.filter(x=>x.mode===q.mode&&x.level===q.level&&x.id!==q.id).map(x=>x[key]);return shuffled([expected(q,step),...shuffled([...new Set(others.filter(v=>v!==expected(q,step)))]).slice(0,2)])}
function home(){if(![3,5,10].includes(state.count))state.count=5;state.screen='home';const story=state.mode==='story';app.innerHTML=`<div class="setup-intro"><p class="eyebrow">今日の練習を選ぼう</p><h2>文章の中に、手がかりがある。</h2><p>一つの文章を、5つのステップで読み解こう。</p></div><div class="setup-layout"><form id="setup" class="card"><fieldset class="group"><legend>1　読む文章</legend><div class="choices">${[['story','物語文','気持ちと、その根拠'],['essay','説明文','考えと、その理由']].map(([v,t,s])=>`<label class="pick"><input type="radio" name="mode" value="${v}" ${state.mode===v?'checked':''}><span><strong>${t}</strong><small>${s}</small></span></label>`).join('')}</div></fieldset><fieldset class="group"><legend>2　レベル</legend><div class="choices">${LEVELS.map((x,i)=>`<label class="pick"><input type="radio" name="level" value="${i+1}" ${state.level===i+1?'checked':''}><span><strong>${i+1}　${i===2&&!story?'理由と例を分ける':i===3&&!story?'考えをつなぐ':x}</strong><small>${['選択中心・はじめの一歩','短い記述・抜き出し','言葉の裏の意味を読む','受験の基礎〜標準へ'][i]}</small></span></label>`).join('')}</div></fieldset><fieldset class="group"><legend>3　文章の数</legend><div class="count-row">${[3,5,10].map(n=>`<label class="pick"><input type="radio" name="count" value="${n}" ${state.count===n?'checked':''}><strong>${n}題</strong></label>`).join('')}</div><p class="small" style="margin-top:10px">1題につき5ステップ。少しずつなら3題から。</p></fieldset><button class="primary wide" type="submit">練習をはじめる　→</button><p class="small" style="margin-top:12px">${story?'物語文':'説明文'}・レベル${state.level}から、重複しない文章を選ぶよ。</p></form><aside class="card"><p class="eyebrow">${story?'気持ちを読む':'考えを読む'}5ステップ</p><h2>${story?'「なぜそう思った？」まで。':'「何を、なぜ伝える？」'}</h2><ol class="route-list">${(story?['何が起きた？','何を言った・何をした？','どんな気持ち？','手がかりの言葉は？','気持ちはどう変わった？']:['何についての文章？','筆者の考えは？','そう考える理由は？','どんな具体例がある？','結論は何？']).map((x,i)=>`<li><span class="step-num">${i+1}</span>${x}</li>`).join('')}</ol><div class="note">${story?'答えは一つとは限らないよ。<br>自分の考えと、文章の言葉をつなげよう。':'「具体例」と「伝えたい考え」は別のもの。<br>例を使って、何を伝えているか考えよう。'}</div><div class="home-example"><span class="badge">${BANK.length.toLocaleString()}題収録</span><p class="small" style="margin-top:10px">物語文 ${BANK.filter(q=>q.mode==='story').length}題 / 説明文 ${BANK.filter(q=>q.mode==='essay').length}題<br>4段階で、読む力を少しずつ。</p></div></aside></div><details class="parent"><summary>おうちの方へ・教材について</summary><p>小学4年生ごろから、四谷大塚の偏差値40〜44程度を目指す学習を想定した基礎練習です。公式教材・偏差値判定テストではありません。まずはレベル1〜2から始め、慣れたら3〜4へ進めてください。</p><p>事実の選択は答えを確認します。自由記述は自動で意味を採点せず、解答例と比べる方式です。例にない読み方も、文章の根拠とつながれば大切な答えです。迷った答えは大人と話し合ってください。</p><p>学習中の答えは画面を閉じると消えます。通信や登録は不要です。${BANK.length===1000?'1000題は物語・説明各125テーマを4段階で読む構成です。同じテーマを深める文章も含み、名前だけを差し替えた問題はありません。':''}</p></details>`;
 app.insertAdjacentHTML('beforeend',`<section class="card" style="margin-top:24px"><p class="eyebrow">慣れてきたら・追加の3題</p><h2>名作の一場面を読む</h2><p class="small">新美南吉の作品から。短い場面を、前の事情と合わせて読もう。必ず出題される作品という意味ではないよ。</p><div class="actions">${CLASSICS.map((q,i)=>`<button type="button" data-classic="${i}">${esc(q.source.title)}</button>`).join('')}</div></section>`);app.querySelectorAll('[data-classic]').forEach(el=>el.onclick=()=>start('story',4,1,[CLASSICS[Number(el.dataset.classic)]]));
 const form=document.getElementById('setup');form.addEventListener('change',()=>{const d=new FormData(form);state.mode=d.get('mode');state.level=Number(d.get('level'));state.count=Number(d.get('count'));const active=document.activeElement;const name=active.name,value=active.value;home();app.querySelector(`input[name="${name}"][value="${value}"]`)?.focus()});form.addEventListener('submit',e=>{e.preventDefault();start(state.mode,state.level,state.count)})}
function start(mode,level,count,custom){if(custom&&(!Array.isArray(custom)||!custom.length||custom.length>10||custom.some(q=>![...BANK,...CLASSICS].includes(q))))throw Error('練習する問題を確かめてください');const queue=custom||pickQuestions(mode,level,count);Object.assign(state,{mode,level,count:queue.length,screen:'exercise',queue,index:0,step:0,records:[],answers:[],checked:false,reflection:null,selected:[],draft:'',failures:0,options:null});renderExercise();focusPassage()}
function focusPassage(){requestAnimationFrame(()=>{document.getElementById('passage-heading')?.focus({preventScroll:true});window.scrollTo(0,0)})}
function focusHeading(){requestAnimationFrame(()=>{document.getElementById('question-heading')?.focus({preventScroll:true});document.getElementById('answer-card')?.scrollIntoView({behavior:'instant',block:'start'})})}
function current(){return state.queue[state.index]}
function saveDraft(){if(questionInfo(current(),state.step).type==='change'){state.selected=['change-before','change-after','change-trigger'].map(id=>document.getElementById(id)?.value||'');return}const field=document.getElementById('written');if(field)state.draft=field.value;const chosen=[...app.querySelectorAll('input[name="answer"]:checked')].map(x=>x.value);if(chosen.length)state.selected=chosen;else if(['choice','feeling'].includes(questionInfo(current(),state.step).type))state.selected=[];const other=document.getElementById('other-feeling');if(other)state.draft=other.value}
function renderExercise(){const q=current(),s=state.step,info=questionInfo(q,s),ls=labels(q),evidence=info.type==='evidence'&&!state.checked;

 app.innerHTML=`<div class="session-top"><strong>${state.mode==='story'?'物語文':'説明文'} <span class="small">レベル${state.level}</span>　${state.index+1} / ${state.count}題</strong><button id="exit" class="quiet">入口へ</button></div><div class="progress" role="progressbar" aria-label="練習の進み具合" aria-valuemin="0" aria-valuemax="${state.count*5}" aria-valuenow="${state.index*5+s}"><span style="width:${(state.index*5+s)/(state.count*5)*100}%"></span></div><div class="exercise-layout"><section class="card reading" aria-label="問題の文章"><p class="eyebrow">文章を読もう</p><h2 id="passage-heading" tabindex="-1">${esc(q.title)}</h2>${q.context?`<p class="note" style="margin:0 0 16px">${esc(q.context)}</p>`:''}<div class="passage">${q.lines.map((line,i)=>evidence?`<button type="button" class="line selectable" data-line="${i}" aria-pressed="${state.selected.includes(String(i))}"><span class="line-number">${i+1}</span><span>${esc(line)}</span></button>`:`<div class="line"><span class="line-number">${i+1}</span><span>${esc(line)}</span></div>`).join('')}</div>${evidence?'<p class="small" style="margin-top:14px">使う行を押して選ぼう。複数選べるよ。</p>':''}${q.source?`<details class="source"><summary>作品の出典・言葉の説明</summary><p>${esc(q.source.author)}『${esc(q.source.title)}』より<br>${esc(q.source.note)}</p><a href="${esc(q.source.url)}" target="_blank" rel="noopener">青空文庫で作品を読む</a></details>`:''}</section><section class="card" id="answer-card"><div class="step-track" aria-label="ステップ${s+1}、${ls[s]}">${ls.map((x,i)=>`<span class="${i<s?'done':i===s?'current':''}"></span>`).join('')}</div><div class="question"><p class="eyebrow">STEP ${s+1} / 5　${ls[s]}</p><h2 id="question-heading" tabindex="-1">${esc(info.prompt)}</h2><p class="small">${esc(info.help)}</p></div><form id="answer-form">${renderInput(info,q)}<p id="error" class="error" role="alert"></p>${state.checked?renderFeedback(q,s):`<div class="actions">${s?'<button type="button" id="back">前のステップ</button>':''}<button class="primary" type="submit">${q.mode==='story'&&s===2?'根拠を探す　→':'答えをたしかめる'}</button></div>`}</form></section></div>`;
 document.getElementById('exit').onclick=()=>document.getElementById('exit-dialog').showModal();document.getElementById('answer-form').onsubmit=e=>{e.preventDefault();submit()};document.getElementById('back')?.addEventListener('click',back);document.getElementById('next')?.addEventListener('click',next);document.getElementById('revise')?.addEventListener('click',revise);app.querySelectorAll('[data-line]').forEach(el=>el.onclick=()=>{saveDraft();const i=el.dataset.line;state.selected=state.selected.includes(i)?state.selected.filter(x=>x!==i):[...state.selected,i].sort((a,b)=>a-b);state.draft=state.selected.map(j=>q.lines[Number(j)]).join('\n');renderExercise();app.querySelector(`[data-line="${i}"]`)?.focus({preventScroll:true})});app.querySelectorAll('[data-reflect]').forEach(el=>el.onclick=()=>{state.reflection=el.dataset.reflect;renderExercise();document.getElementById('next')?.focus({preventScroll:true})});document.getElementById('show-model')?.addEventListener('click',()=>{state.checked=true;state.reflection='practice';recordAnswer(true);renderExercise()});

}
function renderInput(info,q){if(info.type==='change'){const words=[...FEELINGS,'自信がある','申しわけない','さびしい','相手を認めたい','また挑戦したい','感謝している','楽しみにしている','ほかの気持ち・言葉に迷う'];return `<div class="change-inputs">${['初めの気持ち','終わりの気持ち'].map((label,i)=>`<div><label class="form-label" for="change-${i?'after':'before'}">${label}</label><select id="change-${i?'after':'before'}" class="wide" ${state.checked?'disabled':''}><option value="">選んでみよう</option>${words.map(w=>`<option ${state.selected[i]===w?'selected':''}>${esc(w)}</option>`).join('')}</select></div>`).join('')}</div><label for="change-trigger" class="form-label" style="margin-top:18px">きっかけ・変化を考える手がかり</label><select id="change-trigger" class="wide" ${state.checked?'disabled':''}><option value="">文章のどの行かな？</option>${q.lines.map((line,i)=>`<option value="${i+1}" ${state.selected[2]===String(i+1)?'selected':''}>${i+1}行目</option>`).join('')}</select>`}const disabled=state.checked?'disabled':'';if(info.type==='choice'||info.type==='feeling'){const choices=info.type==='feeling'?FEELINGS:state.options;return `<fieldset class="group"><legend class="sr-only">答えを選ぶ</legend><div class="answer-options ${info.type==='feeling'?'feelings':''}">${choices.map((x,i)=>`<label class="answer-option"><input type="${info.type==='feeling'?'checkbox':'radio'}" name="answer" value="${esc(x)}" ${state.selected.includes(x)?'checked':''} ${disabled}><span>${esc(x)}</span></label>`).join('')}</div></fieldset>${info.type==='feeling'?`<label class="form-label" for="other-feeling">ほかの気持ちがあれば書こう（空らんでもOK）</label><textarea id="other-feeling" maxlength="180" style="min-height:72px" ${state.checked?'readonly':''}>${esc(state.draft)}</textarea>`:''}`}
 return `<label class="form-label" for="written">${info.type==='evidence'?'文章から抜き出した言葉':'あなたの答え'}</label><textarea id="written" maxlength="${info.type==='evidence'?1800:500}" ${state.checked?'readonly':''} placeholder="${info.type==='evidence'?'文章の行を押すか、手がかりの言葉をここに写そう。':q.mode==='story'&&state.step===4?'初めは……。……がきっかけで、最後には……。':'自分の言葉で書いてみよう。'}">${esc(state.draft)}</textarea><div class="input-note"><small>${info.type==='evidence'?'抜き出しは文章と同じ言葉で。':'短い言葉から始めて大丈夫。'}</small><small id="char-count">${state.draft.length} / ${info.type==='evidence'?1800:500}字</small></div>`}
function answerText(){const info=questionInfo(current(),state.step);if(info.type==='change')return state.selected.length===3&&state.selected.every(Boolean)?`初め：${state.selected[0]} → 終わり：${state.selected[1]}。手がかり：${state.selected[2]}行目。`:'';return ['choice','feeling'].includes(info.type)?[...state.selected,state.draft.trim()].filter(Boolean).join('、'):state.draft.trim()}
function quoteExists(q,text){const parts=text.split(/\r?\n/).map(normalize).filter(Boolean);return parts.length>0&&parts.every(part=>normalize(q.lines.join('')).includes(part))}
function submit(){saveDraft();const q=current(),s=state.step,info=questionInfo(q,s),answer=answerText(),error=document.getElementById('error');if(!normalize(answer)){error.textContent='答えを選ぶか、言葉を書いてみよう。';return}if(info.type==='evidence'&&!quoteExists(q,answer)){error.textContent='文章の言葉と少し違うようだよ。使う行を押すか、文章と同じ言葉で抜き出してみよう。';return}
 if(q.mode==='story'&&s===2){recordAnswer();nextStep();return}

function recordAnswer(revealed=false){state.answers[state.step]={text:answerText(),selected:[...state.selected],draft:state.draft,failures:state.failures,revealed,reflection:state.reflection}}
function rationale(q,s){if(q.mode==='story')return [ '①の出来事と、②の行動を分けて読むと、気持ちの理由が見つけやすくなります。','気持ちは心の中のこと。行動や言葉は、文章に書かれている手がかりです。',q.why,q.why,'場面の前後を比べ、手がかりの言葉や出来事と結びつけます。変わった気持ちと、残った気持ちの両方を考えられます。'][s];return ['文章全体でくり返し取り上げられているものが話題です。',`筆者の考えは「${q.claim}」です。理由や具体例と区別します。`,`「${q.reason}」という理由が、筆者の考えを支えています。`,`「${q.example}」という例を通して、筆者は「${q.claim}」と伝えています。`,`具体例の細かい場面だけでなく、「${q.conclusion}」という全体の考えをまとめます。`][s]}
function renderFeedback(q,s){const info=questionInfo(q,s),objective=info.type==='choice',a=state.answers[s],paired=q.mode==='story'&&s===3;const pairFeel=state.answers[2]?.text||'';return `<div class="feedback ${objective&&a?.revealed?'retry':objective?'':'review'}" role="region" aria-label="答えの確認"><h3 id="feedback-heading" tabindex="-1">${objective?(a?.revealed?'文章と答えを見比べよう':'文章から見つけられたね'):'答えの例と、比べてみよう'}</h3>${paired?`<div class="your-answer"><strong>あなたの気持ち：</strong>${esc(pairFeel)}<br><strong>手がかり：</strong>${esc(a?.text)}</div>`:''}<p><strong>${paired?'読み取りの例':'答えの例'}</strong><br>${esc(paired?q.feel.join(' ／ '):expected(q,s))}</p><p>${esc(rationale(q,s))}</p>${info.type==='evidence'?`<p class="small">言葉が文章にあることは確認できたよ。${paired?'その言葉が、自分の考えた気持ちにつながるか':'その言葉が、筆者の考えの理由になっているか'}を、次に確かめよう。</p>`:''}${paired?`<p class="small">たとえば②の「${esc(q.lines[1])}」が手がかりです。別の言葉でも、気持ちとのつながりを説明できれば考えられる答えです。</p>`:''}${!objective?`<p class="small">${info.type==='evidence'?'例と違う箇所でも、本文から抜き出した言葉が根拠になっていれば大丈夫。':'例と同じ言葉でなくて大丈夫。自分の考えを、文章で説明できるかが大切だよ。'}</p><div class="reflection" role="group" aria-label="自分の答えをふり返る"><button type="button" data-reflect="ok" aria-pressed="${state.reflection==='ok'}">${paired?'気持ちと根拠がつながった':'文章をもとに説明できた'}</button><button type="button" data-reflect="practice" aria-pressed="${state.reflection==='practice'}">まだ迷う・あとで見直したい</button></div>`:''}</div><div class="actions"><button type="button" id="revise">${paired?'気持ちから書き直す':'書き直す'}</button><button type="button" class="primary" id="next" ${!state.reflection?'disabled':''}>${s===4?(state.index===state.count-1?'ふり返りへ　→':'次の文章へ　→'):'次のステップ　→'}</button></div>`}
function next(){if(!state.reflection)return;state.answers[state.step].reflection=state.reflection;if(state.step<4){nextStep();return}state.records.push({question:current(),answers:structuredClone(state.answers)});if(state.index+1>=state.count){showResults();return}state.index++;state.step=0;state.answers=[];resetStep();renderExercise();focusPassage()}
function resetStep(){Object.assign(state,{checked:false,reflection:null,selected:[],draft:'',failures:0,options:null})}

function restoreStep(n){state.step=n;const a=state.answers[n];resetStep();if(a){state.selected=[...a.selected];state.draft=a.draft;state.failures=a.failures}state.answers=state.answers.slice(0,n);renderExercise();focusHeading()}

app.innerHTML=`<section class="card result-hero"><p class="eyebrow">今日のふり返り</p><h2 id="question-heading" tabindex="-1">${records.length}題、最後まで考えたね。</h2><p>書いた答えと手がかりを、もう一度見てみよう。</p><div class="stats"><div class="stat"><strong>${records.length}</strong><span>読み終えた文章</span></div><div class="stat"><strong>${first} / ${objective.length}</strong><span>最初に選べた事実の答え</span></div><div class="stat"><strong>${review.length}</strong><span>見直したい文章</span></div></div><p class="small" style="margin-top:18px">自由に書いた答えは点数にしていません。文章とつながるかを自分で確かめた記録です。</p><div class="actions">${review.length?'<button type="button" id="retry">見直したい文章をもう一度</button>':''}<button class="primary" id="again">同じ設定で新しく練習</button><button id="home">入口に戻る</button></div></section><div class="review-list">${records.map((r,i)=>`<details><summary>${i+1}　${esc(r.question.title)}　<span class="small">${r.answers.some(a=>a.reflection==='practice'||a.failures)?'あとで見直す':'ふり返り済み'}</span></summary><div class="your-answer">${r.question.lines.map((x,j)=>`${j+1}　${esc(x)}`).join('<br>')}</div>${r.answers.map((a,j)=>`<div class="review-step"><h3>${j+1}　${labels(r.question)[j]}</h3><p><strong>あなたの答え：</strong>${esc(a.text)}</p><p class="small"><strong>答えの例：</strong>${esc(expected(r.question,j))}</p>${j>=2?`<p class="small">${esc(rationale(r.question,j))}</p>`:''}</div>`).join('')}</details>`).join('')}</div>`;document.getElementById('home').onclick=()=>{home();window.scrollTo(0,0)};document.getElementById('again').onclick=()=>state.queue[0]?.source?start('story',4,1,[shuffled(CLASSICS)[0]]):start(state.mode,state.level,state.count);document.getElementById('retry')?.addEventListener('click',()=>start(state.mode,state.level,review.length,review.map(r=>r.question)));window.scrollTo(0,0);requestAnimationFrame(()=>document.getElementById('question-heading')?.focus({preventScroll:true}))}
